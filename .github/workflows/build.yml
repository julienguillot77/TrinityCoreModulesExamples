name: Build module examples

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_PREFIX_PATH=${{ github.workspace }}/../trinitycore-install
      - name: Build
        run: cmake --build build --parallel
